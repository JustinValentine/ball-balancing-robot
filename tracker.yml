%YAML:1.0
bright_ball: 1
threshold: 160
min_radius_px: 4.
max_radius_px: 90.
min_circularity: 0.60
roi_half_size_px: 72
max_reprojection_px: 1.5
# Optional measured ball diameter for rejecting false matches
ball_diameter_mm: 0.
diameter_tolerance_fraction: 0.30
# Parallel air/acrylic/air slab. Use air-only stereo calibration.
acrylic_thickness_mm: 6.35
acrylic_refractive_index: 1.49
# Fixed plate only, normal from cameras toward the ball in LEFT optical axes.
# A timestamped normals file on the command line overrides this vector.
fixed_plate_normal: [0., 0., 1.]
normal_max_age_us: 5000
# Positive when capture timestamps follow exposure, measured on the rig.
capture_minus_exposure_us: 0
